type: charm
name: quantum-terminal
summary: Juju charm for the Quantum Service SDN architecture terminal.
description: |
  This charm deploys and operates the Quantum Service SDN architecture 
  terminal node. It integrates with the gNOI switching client to execute 
  terminal-level operations and handle YANG model configurations.

platforms:
  ubuntu@24.04:

config:
  options:
    controller-ip:
      default: "10.0.0.2"
      type: string
      description: "The IP address of the SDN controller."

actions:
  create-cross-connect:
    description: "Triggers a RESTCONF request using example-quantum-switching-terminal-service.yang."
    params:
      service-id:
        type: string
        description: "Service Identifier"
        default: "example-qservice-01"
      target-node-ip:
        type: string
        description: "IP address of the switch node"
        default: "10.0.0.254"
      ingress-port:
        type: integer
        default: 1
      egress-port:
        type: integer
        default: 2
      admin-state:
        type: string
        default: "ENABLED"
