type: charm
bases:
  - build-on:
      - name: ubuntu
        channel: "22.04"
    run-on:
      - name: ubuntu
        channel: "22.04"

summary: Quantum Terminal Switching Charm
description: |
  A Juju charm for operating the Quantum Service SDN architecture terminal.

actions:
  create-cross-connect:
  description: "Triggers a RESTCONF request using example-quantum-switching-terminal-service.yang."
  params:
    service-id:
      type: string
      description: "Service Identifier"
      default: "example-qservice-01"
    target-node-ip:
      type: string
      description: "IP address of the switch node"
      default: "10.0.0.254"
    ingress-port:
      type: integer
      default: 1
    egress-port:
      type: integer
      default: 2
    admin-state:
      type: string
      default: "ENABLED"
