syntax = "proto3";

package quantum.terminal.gnoi.v1;

service TerminalQuantumGnoiSwitchingService {
  rpc SetCrossConnect (CrossConnectRequest) returns (CrossConnectResponse);
  rpc GetSwitchStatus (StatusRequest) returns (StatusResponse);
}

message CrossConnectRequest {
  bool state = 1;
}

message CrossConnectResponse {
  bool success = 1;
  string message = 2;
}

message StatusRequest {}

message StatusResponse {
  bool is_connected = 1;
  string switch_type = 2;
}
